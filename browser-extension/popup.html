<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Interview OS Job Sync</title>
  <style>
    body{width:340px;margin:0;padding:16px;color:#10243e;background:#f5f9ff;font:13px/1.5 "Microsoft YaHei UI",sans-serif}h1{margin:0 0 4px;font-size:17px}p{margin:0 0 14px;color:#657c94}label{display:block;margin:10px 0 5px;font-weight:600}input{box-sizing:border-box;width:100%;padding:9px;border:1px solid #b9cce0;background:#fff}button{margin-top:10px;padding:9px 12px;border:1px solid #8db7df;color:#075ead;background:#e7f3ff;font-weight:600;cursor:pointer}button.primary{width:100%;color:#fff;border-color:#087cf0;background:#087cf0}button.secondary{width:100%;background:#eef7ff}.row{display:flex;gap:8px}.row button{flex:1}.status{min-height:20px;margin-top:10px;color:#28618f;white-space:pre-wrap}.note{margin-top:12px;padding-top:10px;border-top:1px solid #dbe7f2;font-size:12px}
  </style>
</head>
<body>
  <h1>Interview OS Job Sync</h1>
  <p>读取招聘列表或详情页岗位，并同步到本机 Interview OS。</p>
  <label for="token">同步令牌</label>
  <input id="token" type="password" autocomplete="off" placeholder="从 Interview OS 岗位同步中心复制" />
  <div class="row"><button id="save" type="button">保存令牌</button><button id="check" type="button">检查连接</button></div>
  <button id="sync" class="primary" type="button">同步当前页面</button>
  <button id="sync-details" class="secondary" type="button">列表岗位 + 后台详情补全</button>
  <div id="status" class="status"></div>
  <p class="note">可使用你当前浏览器登录态打开详情页；不会读取网站密码或导出 Cookie，不会绕过验证码，不会发送消息或自动投递。</p>
  <script src="popup.js"></script>
</body>
</html>
